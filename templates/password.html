{% extends "base.html" %}
{% block title %}{{ _('password.title') }} · MyBoutiq{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card shadow-sm mt-4">
      <div class="card-header fw-semibold">{{ _('password.title') }}</div>
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">{{ _('password.current') }}</label>
            <input type="password" name="current_password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _('password.new') }}</label>
            <input type="password" name="new_password" class="form-control" required>
            <div class="form-text">{{ _('password.hint') }}</div>
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _('password.confirm') }}</label>
            <input type="password" name="confirm_password" class="form-control" required>
          </div>
          <div class="d-flex justify-content-between">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">{{ _('action.cancel') }}</a>
            <button type="submit" class="btn btn-primary">{{ _('action.save') }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
