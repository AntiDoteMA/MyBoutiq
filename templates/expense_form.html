{% extends "base.html" %}
{% block title %}{{ _('expense_form.title') }} · MyBoutiq{% endblock %}
{% block content %}
<div class="mb-page">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  .mb-page {
    --mb-bg:        #F7F4EC;
    --mb-surface:   #FFFFFF;
    --mb-ink:       #232821;
    --mb-muted:     #8A8272;
    --mb-line:      #E7E0D2;
    --mb-brand-dp:  #163329;
    --mb-gold:      #B9893C;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .mb-page {
    background: var(--mb-bg);
    margin: -1.5rem -1.5rem 0;
    padding: 2.5rem 1.5rem;
    min-height: calc(100vh - 90px);
    font-family: var(--font-body);
    color: var(--mb-ink);
  }
  .mb-page * { box-sizing: border-box; }

  .mb-page .card {
    border: 1px solid var(--mb-line); border-radius: 14px; box-shadow: none; background: var(--mb-surface);
  }
  .mb-page .card-header {
    background: var(--mb-surface); border-bottom: 1px solid var(--mb-line);
    font-family: var(--font-display); font-weight: 600; font-size: 1.2rem;
    color: var(--mb-brand-dp); padding: 1.1rem 1.4rem;
  }
  .mb-page .card-body { padding: 1.4rem; }
  .mb-page .text-muted { color: var(--mb-muted) !important; }
  .mb-page .form-label {
    font-size: .78rem; font-weight: 600; letter-spacing: .03em; color: var(--mb-muted);
  }
  .mb-page .form-control { border-color: var(--mb-line); border-radius: 8px; }
  .mb-page .form-control:focus {
    border-color: var(--mb-gold); box-shadow: 0 0 0 .2rem rgba(185, 137, 60, .15);
  }
  .mb-page .btn { border-radius: 8px; font-weight: 500; }
  .mb-page .btn-warning { background: var(--mb-surface); color: var(--mb-gold); border-color: var(--mb-gold); }
  .mb-page .btn-warning:hover { background: var(--mb-gold); color: #fff; }
  .mb-page .btn-outline-secondary { color: var(--mb-muted); border-color: var(--mb-line); }
  .mb-page .btn-outline-secondary:hover { background: var(--mb-surface); color: var(--mb-ink); border-color: var(--mb-ink); }

  @media (max-width: 560px) {
    .mb-page { margin: -1rem -1rem 0; padding: 1.5rem 1rem; }
  }
</style>

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header fw-semibold">{{ _('expense_form.title') }}</div>
      <div class="card-body">
        <p class="text-muted">{{ _('expense_form.hint') }}</p>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">{{ _('expense_form.date') }}</label>
            <input type="date" name="date" class="form-control" value="{{ request.form.get('date', today) }}">
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _('expense_form.description') }}</label>
            <input type="text" name="description" class="form-control" value="{{ request.form.get('description', '') }}" placeholder="{{ _('expense_form.desc_ph') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _('expense_form.amount') }}</label>
            <input type="number" name="amount" step="0.01" min="0" class="form-control" value="{{ request.form.get('amount', '') }}" placeholder="{{ _('sale_form.placeholder') }}" required>
          </div>
          <div class="d-flex justify-content-between">
            <a href="{{ url_for('expenses') }}" class="btn btn-outline-secondary">{{ _('action.cancel') }}</a>
            <button type="submit" class="btn btn-warning">{{ _('action.save') }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

</div><!-- /.mb-page -->
{% endblock %}
